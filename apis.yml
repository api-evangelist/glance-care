aid: glance-care
name: Buglance
description: >-
  Buglance is a crowdsourced software testing platform that connects companies with a global
  community of more than 50,000 professional bug hunters to find defects and quality issues
  in mobile apps, games, e-commerce sites, and web platforms before release. Testers can be
  targeted by country, age, gender, and device type across a fleet of 10,000+ real devices,
  and detailed, validated, severity-classified bug reports are typically delivered in under
  24 hours through live analytics dashboards. Buglance is a 500 Global portfolio company and
  markets to mobile gaming, e-commerce and retail, and lifestyle and productivity teams. It
  is added to the API Evangelist network as a company profile; no public developer API,
  OpenAPI definition, or developer portal was found during enrichment.
